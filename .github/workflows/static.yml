name: Desplegar en GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Verificar y preparar estructura de archivos
        run: |
          echo "=== Archivos en la raíz del repositorio ==="
          ls -la
          if [ ! -f "src/main.tsx" ]; then
            echo "src/main.tsx no encontrado en la raíz. Buscando en subdirectorios..."
            FOUND_MAIN=$(find . -maxdepth 3 -name "main.tsx" -not -path "*/node_modules/*" | head -n 1)
            if [ -n "$FOUND_MAIN" ]; then
              SUBDIR=$(dirname $(dirname "$FOUND_MAIN"))
              echo "Proyecto detectado dentro de subcarpeta: $SUBDIR"
              echo "Copiando archivos a la raíz para compilar..."
              cp -r $SUBDIR/* . 2>/dev/null || true
            else
              echo "ERROR: La carpeta 'src/' no existe en tu repositorio de GitHub."
              echo "Por favor asegúrate de subir la carpeta 'src/' completa."
            fi
          fi

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Compilar proyecto
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir artefacto compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
